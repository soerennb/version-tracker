services:
  app:
    environment:
      TRUSTED_PROXIES: "*"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0}
    depends_on:
      app:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN for Caddy mode}
      CADDY_EMAIL: ${CADDY_EMAIL:?Set CADDY_EMAIL for Caddy mode}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
    name: ${COMPOSE_PROJECT_NAME:-versiontracker}_caddy_data
  caddy_config:
    name: ${COMPOSE_PROJECT_NAME:-versiontracker}_caddy_config
