name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP quality and tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: mbstring, pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-8.3-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build

      - name: Check PHP formatting
        run: |
          vendor/bin/pint
          git diff --exit-code

      - name: Run PHP tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --fund=false

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build

  mariadb:
    name: MariaDB integration tests
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_DATABASE: versiontracker
          MARIADB_USER: versiontracker
          MARIADB_PASSWORD: versiontracker
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: mbstring, pdo_mysql

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP tests with MariaDB
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: versiontracker
          DB_USERNAME: versiontracker
          DB_PASSWORD: versiontracker
        run: php artisan test

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build application image
        run: docker build --tag versiontracker:test .

      - name: Start application container
        run: |
          docker run --detach --name versiontracker --publish 8080:80 \
            --env APP_ENV=production \
            --env APP_DEBUG=false \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            versiontracker:test

      - name: Check health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/up; then
              exit 0
            fi

            sleep 2
          done

          docker logs versiontracker
          exit 1
