name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change classification
    uses: ./.github/workflows/change-classification.yml

  php:
    name: PHP quality and tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"
    needs:
      - changes
      - frontend
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.automation == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: intl, mbstring, pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build

      - name: Check PHP formatting
        run: |
          vendor/bin/pint
          git diff --exit-code

      - name: Run PHP tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.automation == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --fund=false

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build

  mariadb:
    name: MariaDB integration tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"
    needs:
      - changes
      - frontend
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.automation == 'true'
    services:
      db:
        image: mariadb:11.8.8@sha256:24e76fcec8c003a0362d0dd53f4806e7e79458d7fdeaf47437760e19496f5a9c
        env:
          MARIADB_DATABASE: versiontracker
          MARIADB_USER: versiontracker
          MARIADB_PASSWORD: versiontracker
          MARIADB_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=10
        ports:
          - 3306:3306
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: intl, mbstring, pdo_mysql

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download frontend assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build

      - name: Run PHP tests with MariaDB
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: versiontracker
          DB_USERNAME: versiontracker
          DB_PASSWORD: versiontracker
        run: php artisan test

  container:
    name: Container integration test
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.infrastructure == 'true' ||
      needs.changes.outputs.automation == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/soerennb/version-tracker:test
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/soerennb/version-tracker:test
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Prepare Compose environment
        run: |
          cp .env.docker.example .env.docker
          sed -i 's/^VERSION=$/VERSION=test/' .env.docker
          sed -i 's/^DEPLOYMENT_MODE=$/DEPLOYMENT_MODE=proxy/' .env.docker
          sed -i 's/^APP_KEY=$/APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' .env.docker
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=versiontracker/' .env.docker
          sed -i 's/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=root/' .env.docker
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml config --format json > compose.config.json
          jq -e '.services.app.healthcheck != null and .services.worker.healthcheck == null and .services.scheduler.healthcheck == null' compose.config.json
          jq -e '.services.worker.command | index("--queue=notifications,imports,default") != null' compose.config.json

      - name: Initialize and check application
        run: |
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml up --detach db
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml run --rm app php artisan migrate --force
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml up --detach app worker scheduler

          healthy=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/up; then
              healthy=true
              break
            fi

            sleep 2
          done

          if [[ "$healthy" != true ]]; then
            docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml logs
            exit 1
          fi

          for service in worker scheduler; do
            docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml ps --status running --services | grep --fixed-strings --line-regexp "$service"
          done

          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY app php -r "exit(ini_get('upload_max_filesize') === '32M' && ini_get('post_max_size') === '32M' && ini_get('memory_limit') === '256M' ? 0 : 1);"
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY app test -L /var/www/html/public/storage
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY app apachectl -t
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY app sh -c 'test "$(stat --format=%a /var/www/html)" = 755'

      - name: Back up and restore application data
        run: |
          backup_directory="$(./install.sh backup)"
          test -s "$backup_directory/database.sql"
          test -s "$backup_directory/storage.tar.gz"
          test "$(stat --format=%a "$backup_directory/environment.backup")" = 600
          test -s "$backup_directory/manifest"
          test -s "$backup_directory/checksums.sha256"
          sha256sum --check --strict "$backup_directory/checksums.sha256"

          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml down --volumes --remove-orphans
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml up --detach db

          for _ in {1..30}; do
            if docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY db healthcheck.sh --connect --innodb_initialized; then
              break
            fi

            sleep 2
          done

          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY db sh -c 'exec mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" "$MARIADB_DATABASE"' < "$backup_directory/database.sql"
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml exec --no-TTY db sh -c 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" "$MARIADB_DATABASE" --skip-column-names --execute="SELECT COUNT(*) FROM migrations"' | grep --extended-regexp '^[1-9][0-9]*$'
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml run --rm app sh -c 'tar -xzf - -C /var/www/html' < "$backup_directory/storage.tar.gz"
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml up --detach app worker scheduler

          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/up; then
              exit 0
            fi

            sleep 2
          done

          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml logs
          exit 1

      - name: Clean up containers
        if: always()
        run: |
          if [[ -f .env.docker ]]; then
            docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml down --volumes --remove-orphans
          fi

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.infrastructure == 'true' ||
      needs.changes.outputs.automation == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment configurations
        run: |
          cp .env.docker.example .env.docker
          sed -i 's/^VERSION=$/VERSION=v0.0.0/' .env.docker
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci/' .env.docker
          sed -i 's/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-root/' .env.docker
          sed -i 's/^CADDY_DOMAIN=$/CADDY_DOMAIN=example.invalid/' .env.docker
          sed -i 's/^CADDY_EMAIL=$/CADDY_EMAIL=ci@example.invalid/' .env.docker
          docker compose --env-file .env.docker -f compose.yml -f compose.proxy.yml config --quiet
          docker compose --env-file .env.docker -f compose.yml -f compose.caddy.yml config --quiet

      - name: Validate Caddyfile
        run: docker run --rm --env CADDY_DOMAIN=example.invalid --env CADDY_EMAIL=ci@example.invalid --volume "$GITHUB_WORKSPACE/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4@sha256:14a9c00d4e833ebc2b65d36515b37bde3b73f0b323a2663aaafc88953d8c4e3f caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  shell:
    name: Installer script
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.infrastructure == 'true' ||
      needs.changes.outputs.automation == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Lint installer
        run: |
          test -x install.sh
          bash -n install.sh
          shellcheck install.sh

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - php
      - frontend
      - mariadb
      - container
      - compose
      - shell
    steps:
      - name: Require successful executed checks
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
